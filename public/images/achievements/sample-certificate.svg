<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A6B29" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="75%" stop-color="#AA8232" />
      <stop offset="100%" stop-color="#6B4F1D" />
    </linearGradient>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF6CC" />
      <stop offset="100%" stop-color="#997324" />
    </linearGradient>
    <pattern id="bgGuilloche" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 Q 10 0 20 20 T 40 20" fill="none" stroke="#D4AF37" stroke-width="0.35" stroke-opacity="0.18"/>
      <path d="M0 20 Q 10 40 20 20 T 40 20" fill="none" stroke="#D4AF37" stroke-width="0.35" stroke-opacity="0.18"/>
    </pattern>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Parchment Background -->
  <rect x="0" y="0" width="1200" height="850" fill="#FCFBF7" />
  <rect x="25" y="25" width="1150" height="800" fill="url(#bgGuilloche)" />

  <!-- Outer Ornate Gold Border -->
  <rect x="30" y="30" width="1140" height="790" fill="none" stroke="url(#goldGrad)" stroke-width="6" rx="4" />
  <rect x="44" y="44" width="1112" height="762" fill="none" stroke="#15162F" stroke-width="1" stroke-opacity="0.25" />
  <rect x="52" y="52" width="1096" height="746" fill="none" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Corner Flourishes -->
  <!-- Top Left -->
  <g transform="translate(52, 52)" stroke="url(#goldGrad)" fill="none" stroke-width="1.5">
    <path d="M 0 40 L 40 40 L 40 0" />
    <circle cx="20" cy="20" r="6" fill="url(#goldGrad)" />
    <path d="M 0 0 L 25 25" />
  </g>
  <!-- Top Right -->
  <g transform="translate(1148, 52) scale(-1, 1)" stroke="url(#goldGrad)" fill="none" stroke-width="1.5">
    <path d="M 0 40 L 40 40 L 40 0" />
    <circle cx="20" cy="20" r="6" fill="url(#goldGrad)" />
    <path d="M 0 0 L 25 25" />
  </g>
  <!-- Bottom Left -->
  <g transform="translate(52, 798) scale(1, -1)" stroke="url(#goldGrad)" fill="none" stroke-width="1.5">
    <path d="M 0 40 L 40 40 L 40 0" />
    <circle cx="20" cy="20" r="6" fill="url(#goldGrad)" />
    <path d="M 0 0 L 25 25" />
  </g>
  <!-- Bottom Right -->
  <g transform="translate(1148, 798) scale(-1, -1)" stroke="url(#goldGrad)" fill="none" stroke-width="1.5">
    <path d="M 0 40 L 40 40 L 40 0" />
    <circle cx="20" cy="20" r="6" fill="url(#goldGrad)" />
    <path d="M 0 0 L 25 25" />
  </g>

  <!-- Header Branding Banner -->
  <g transform="translate(600, 130)" text-anchor="middle">
    <circle cx="0" cy="-20" r="28" fill="#15162F" />
    <polygon points="0,-38 11,-24 24,-24 14,-13 18,0 0,-10 -18,0 -14,-13 -24,-24 -11,-24" fill="url(#goldGrad)" />
    <text y="32" font-family="'Cinzel', 'Georgia', 'Times New Roman', serif" font-size="14" font-weight="bold" letter-spacing="6" fill="#8A6B29">LANDMARK KIA &amp; MOBILITY NETWORK</text>
  </g>

  <!-- Title Section -->
  <g transform="translate(600, 240)" text-anchor="middle">
    <text y="0" font-family="'Cinzel', 'Georgia', 'Times New Roman', serif" font-size="16" font-weight="600" letter-spacing="4" fill="#4A4C68">CERTIFICATE OF</text>
    <text y="48" font-family="'Cinzel', 'Georgia', 'Times New Roman', serif" font-size="34" font-weight="bold" letter-spacing="2" fill="#15162F">STRATEGIC BUSINESS PARTNERSHIP</text>
    <line x1="-200" y1="68" x2="200" y2="68" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="0" cy="68" r="4" fill="url(#goldGrad)" />
  </g>

  <!-- Recipient Presentation -->
  <g transform="translate(600, 360)" text-anchor="middle">
    <text y="0" font-family="'Georgia', serif" font-style="italic" font-size="16" fill="#61637D">This certificate is proudly awarded to recognize operational excellence</text>
    <text y="54" font-family="'Cinzel', 'Georgia', 'Times New Roman', serif" font-size="33" font-weight="bold" letter-spacing="1.5" fill="#31326F">VICTOR LUXURY LIMOUSINE</text>
    <text y="88" font-family="'Cinzel', 'Georgia', 'Times New Roman', serif" font-size="17" font-weight="600" letter-spacing="3" fill="#2D5090">PRIVATE LIMITED</text>
  </g>

  <!-- Citation Body -->
  <g transform="translate(600, 498)" text-anchor="middle">
    <text y="0" font-family="'Georgia', serif" font-size="15" fill="#42445E" font-style="italic">In recognition of disciplined fleet standards, exemplary transit reliability,</text>
    <text y="28" font-family="'Georgia', serif" font-size="15" fill="#42445E" font-style="italic">and sustained dedication to professional corporate transportation synergy.</text>
  </g>

  <!-- Signatures and Official Gold Seal -->
  <g transform="translate(0, 640)">
    <!-- Left Signatory -->
    <g transform="translate(220, 0)">
      <path d="M 10 18 Q 45 -12 75 14 T 130 10 T 170 20" fill="none" stroke="#15162F" stroke-width="2" stroke-linecap="round" opacity="0.8" />
      <line x1="0" y1="30" x2="220" y2="30" stroke="#B0AEC0" stroke-width="1" />
      <text x="110" y="50" text-anchor="middle" font-family="'Georgia', serif" font-size="13" font-weight="bold" fill="#15162F">Authorised Signatory</text>
      <text x="110" y="68" text-anchor="middle" font-family="'Arial', sans-serif" font-size="10" letter-spacing="1" fill="#70728A">LANDMARK MOBILITY ALLIANCE</text>
    </g>

    <!-- Center 3D Gold Seal -->
    <g transform="translate(600, 20)" filter="url(#dropShadow)">
      <circle cx="0" cy="0" r="54" fill="url(#sealGrad)" stroke="#AA8232" stroke-width="2" />
      <circle cx="0" cy="0" r="47" fill="none" stroke="#705218" stroke-width="1.5" stroke-dasharray="3,2" />
      <circle cx="0" cy="0" r="41" fill="url(#sealGrad)" />
      <polygon points="0,-32 8,-12 30,-12 12,2 18,24 0,11 -18,24 -12,2 -30,-12 -8,-12" fill="#8A6822" />
      <text y="-2" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-size="8.5" font-weight="bold" letter-spacing="1.2" fill="#15162F">PARTNERSHIP</text>
      <text y="10" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-size="7" font-weight="bold" letter-spacing="1.5" fill="#473411">&#9733; EXCELLENCE &#9733;</text>
      <polygon points="-20,48 -35,90 -20,82 -5,90 -12,48" fill="#AA8232" opacity="0.9" />
      <polygon points="20,48 12,48 5,90 20,82 35,90" fill="#8A6822" opacity="0.9" />
    </g>

    <!-- Right Signatory -->
    <g transform="translate(760, 0)">
      <path d="M 15 22 Q 55 2 90 20 T 145 12 T 185 18" fill="none" stroke="#15162F" stroke-width="2" stroke-linecap="round" opacity="0.8" />
      <line x1="0" y1="30" x2="220" y2="30" stroke="#B0AEC0" stroke-width="1" />
      <text x="110" y="50" text-anchor="middle" font-family="'Georgia', serif" font-size="13" font-weight="bold" fill="#15162F">Executive Director</text>
      <text x="110" y="68" text-anchor="middle" font-family="'Arial', sans-serif" font-size="10" letter-spacing="1" fill="#70728A">FLEET OPERATIONS DIVISION</text>
    </g>
  </g>

  <!-- Editorial Sample Notice at Bottom -->
  <text x="600" y="780" text-anchor="middle" font-family="'Arial', sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#8A889B">SAMPLE CERTIFICATE &middot; FOR DEMONSTRATION &amp; EDITORIAL GALLERY PURPOSES</text>
</svg>
